<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продвинутый помощник ЧПУ-Склад</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; }
        .chat-container { max-width: 900px; margin: 20px auto; background: #1e2937; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); overflow: hidden; }
        .header { background: #0d6efd; color: white; padding: 18px; text-align: center; font-size: 1.3em; font-weight: bold; }
        .messages { height: 560px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: #1e2937; }
        .message { max-width: 80%; padding: 14px 18px; border-radius: 20px; line-height: 1.45; }
        .user { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 6px; }
        .bot { align-self: flex-start; background: #334155; border-bottom-left-radius: 6px; }
        .input-area { padding: 16px; background: #1e2937; border-top: 1px solid #334155; display: flex; gap: 10px; }
        input { flex: 1; padding: 16px; border-radius: 9999px; border: none; background: #334155; color: white; font-size: 1.1em; }
        button { padding: 0 32px; background: #0d6efd; color: white; border: none; border-radius: 9999px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">🤖 Продвинутый помощник ЧПУ-Склад (второй бот)</div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Задай любой вопрос по Mach3, Универсалу, станкам..." autocomplete="off">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('userInput');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            input.value = '';

            try {
                const res = await fetch('/api/advanced-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                addMessage(data.reply, false);
            } catch (e) {
                addMessage('❌ Ошибка соединения', false);
            }
        }

        input.addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
