    <div class="chat-container">
        <div class="header">🤖 Продвинутый помощник ЧПУ-Склад (второй бот)</div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Задай любой вопрос по Mach3, Универсалу, станкам..." autocomplete="off">
            <button onclick="sendMessage()">Отправить</button>

    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('userInput');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            input.value = '';

            try {
                const res = await fetch('/api/advanced-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                addMessage(data.reply, false);
            } catch (e) {
                addMessage('❌ Ошибка соединения', false);
            }
        }

        input.addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
