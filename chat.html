<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Консультант ЧПУ-Склад</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #chat-container {
            max-width: 700px;
            margin: 30px auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
        }
        #chat-history {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 15px;
            background: white;
        }
        #user-input {
            width: calc(100% - 80px);
            padding: 10px;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>Задайте вопрос консультанту</h2>
        <div id="chat-history"></div>
        <input type="text" id="user-input" placeholder="Введите ваш вопрос о ЧПУ станках...">
        <button onclick="askQuestion()">Отправить</button>
    </div>

    <script>
        async function askQuestion() {
            const inputField = document.getElementById('user-input');
            const historyDiv = document.getElementById('chat-history');
            const userMessage = inputField.value.trim();
            if (!userMessage) return;

            historyDiv.innerHTML += `<p><b>Вы:</b> ${userMessage}</p>`;
            inputField.value = '';
            historyDiv.scrollTop = historyDiv.scrollHeight;

            try {
                const response = await fetch('https://universal-6r3cqdcsq-aleksandrs-projects-98e3f756.vercel.app/api/chat', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage })
                });

                const data = await response.json();
                historyDiv.innerHTML += `<p><b>Консультант:</b> ${data.reply}</p>`;
                historyDiv.scrollTop = historyDiv.scrollHeight;
            } catch (error) {
                historyDiv.innerHTML += `<p><b>Консультант:</b> Извините, что-то пошло не так.</p>`;
            }
        }
    </script>
</body>
</html>
