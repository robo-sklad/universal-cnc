<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат • ЧПУ-Склад</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; }
        .chat-container { max-width: 800px; margin: 20px auto; background: #1e2937; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .header { background: #0d6efd; color: white; padding: 15px; text-align: center; font-size: 1.2em; }
        .messages { height: 500px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; }
        .user { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: #334155; border-bottom-left-radius: 4px; }
        .input-area { display: flex; padding: 15px; background: #1e2937; border-top: 1px solid #334155; }
        input { flex: 1; padding: 14px; border: none; border-radius: 30px; background: #334155; color: white; font-size: 1.1em; }
        button { margin-left: 10px; padding: 0 24px; background: #0d6efd; color: white; border: none; border-radius: 30px; cursor: pointer; }
        .message small { display: block; font-size: 0.75em; opacity: 0.7; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">💬 Чат со специалистом </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
    <input type="text" id="userInput" placeholder="Напишите ваш вопрос..." autocomplete="off">
    
    <!-- НОВЫЕ КНОПКИ -->
    <label for="text-upload" style="cursor: pointer; padding: 0 10px; background: #334155; border-radius: 20px; margin-right: 5px;">📄 Текст</label>
    <input type="file" id="text-upload" accept=".txt,.csv,.gcode,.nc" style="display: none;" />
    
    <label for="image-upload" style="cursor: pointer; padding: 0 10px; background: #334155; border-radius: 20px; margin-right: 5px;">📎 Изображение</label>
    <input type="file" id="image-upload" accept="image/*" capture="environment" style="display: none;" />
    
    <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('userInput');
// ДОБАВЬ ЭТИ ПЕРЕМЕННЫЕ ПЕРЕД function addMessage()
let currentFile = null;
let currentFileName = null;
let currentFileType = null;

// ДОБАВЬ ЭТИ ОБРАБОТЧИКИ ПЕРЕД function sendMessage()
document.getElementById('text-upload').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 100 * 1024) { // Ограничение 100 KB
        alert("Файл слишком большой! Максимум 100 KB.");
        return;
    }
    const reader = new FileReader();
    reader.onload = () => {
        currentFile = reader.result;
        currentFileName = file.name;
        currentFileType = 'text';
        alert(`Файл "${file.name}" загружен! Теперь отправьте сообщение.`);
    };
    reader.readAsText(file);
});

document.getElementById('image-upload').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { // Ограничение 5 MB
        alert("Изображение слишком большое! Максимум 5 MB.");
        return;
    }
    const reader = new FileReader();
    reader.onload = () => {
        currentFile = reader.result;
        currentFileName = file.name;
        currentFileType = 'image';
        alert(`Изображение "${file.name}" загружено! Теперь отправьте сообщение.`);
    };
    reader.readAsDataURL(file);
});
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            div.innerHTML = `${text}<small>${isUser ? 'Вы' : 'учитель'}</small>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
    const text = input.value.trim();
    if (!text && !currentFile) {
        alert("Введите сообщение или загрузите файл!");
        return;
    }

    addMessage(text || `[${currentFileType === 'image' ? 'Изображение' : 'Файл'}: ${currentFileName}]`, true);
    input.value = '';

    const payload = { message: text };
    if (currentFile) {
        payload.file = currentFile;
        payload.fileName = currentFileName;
        payload.fileType = currentFileType;
    }

    const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    const data = await response.json();
    addMessage(data.reply || 'Ошибка соединения', false);

    // Очищаем загруженный файл после отправки
    currentFile = null;
    currentFileName = null;
    currentFileType = null;
    document.getElementById('text-upload').value = '';
    document.getElementById('image-upload').value = '';
        }
        // Enter для отправки
        input.addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
